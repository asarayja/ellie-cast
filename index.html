<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ellie Cast · Author</title>
  <!-- deling:start (oppdateres automatisk av admin når du publiserer) -->
  <meta name="description" content="Author of The Fragmented Collector. Here you will find the books, sneak peeks and how to get in touch.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ellie Cast">
  <meta property="og:title" content="Ellie Cast">
  <meta property="og:description" content="Author of The Fragmented Collector. Here you will find the books, sneak peeks and how to get in touch.">
  <meta property="og:url" content="https://asarayja.github.io/ellie-cast/">
  <meta property="og:image" content="https://asarayja.github.io/ellie-cast/bilder/deling.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- deling:slutt -->
  <meta name="theme-color" content="#f8edf3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1936" media="(prefers-color-scheme: dark)">
  <script>try{var t=localStorage.getItem('ec-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" href="bilder/ikon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="glow" aria-hidden="true"><i></i><i></i></div>

  <header class="topbar">
    <div class="topbar-inner glass">
      <a class="brand" href="#/"><span class="mono" aria-hidden="true">EC</span><span id="brandName">Ellie Cast</span></a>
      <nav class="nav" id="nav">
        <a href="#/books" data-route="books" data-t="nav_books">Books</a>
        <a href="#/music" data-route="music" data-t="nav_music" hidden>Music</a>
        <a href="#/about" data-route="about" data-t="nav_about">About Ellie</a>
        <a href="#/contact" data-route="contact" data-t="nav_contact">Contact</a>
      </nav>
      <div class="tools">
        <button class="tool" id="themeBtn" aria-label="Change theme">☾</button>
        <button class="tool menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="nav"><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="loading" aria-label="Loading"></div>
  </main>

  <footer class="footer">
    <div class="footer-inner glass">
      <span class="footer-name">Ellie Cast</span>
      <span class="footer-meta">© <span id="year"></span> · <span id="footerRole">Author</span></span>
    </div>
  </footer>

  <div class="queue-panel glass" id="queuePanel" hidden>
    <div class="queue-head">
      <h2 data-t="up_next">Up next</h2>
      <button class="pl-btn" id="queueClose" aria-label="Close">×</button>
    </div>
    <ol class="queue-list" id="queueList"></ol>
  </div>

  <div class="player glass" id="player" hidden>
    <div class="pl-now">
      <div class="pl-cover" id="plCover"></div>
      <div class="pl-meta">
        <strong id="plTitle"></strong>
        <a id="plAlbum" href="#/music"></a>
      </div>
    </div>
    <div class="pl-center">
      <div class="pl-controls">
        <button class="pl-btn pl-toggle" id="plShuffle"></button>
        <button class="pl-btn" id="plPrev"></button>
        <button class="pl-btn pl-play" id="plPlay"></button>
        <button class="pl-btn" id="plNext"></button>
        <button class="pl-btn pl-toggle" id="plRepeat"></button>
      </div>
      <div class="pl-progress">
        <span id="plTime">0:00</span>
        <input type="range" class="range" id="plSeek" min="0" max="1000" value="0">
        <span id="plDur">0:00</span>
      </div>
    </div>
    <div class="pl-side">
      <button class="pl-btn" id="plQueue"></button>
      <input type="range" class="range pl-vol" id="plVol" min="0" max="1" step="0.01">
      <button class="pl-btn pl-close" id="plClose">×</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/app.js"></script>
</body>
</html>
